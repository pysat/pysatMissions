# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Pytest with Flake8

on: [push, pull_request]
env:
  COVERALLS_SERVICE_NUMBER: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.10", "3.12", "3.13", "3.14"]
        numpy_ver: ["latest"]
        test_config: ["latest"]
        include:
          # SPEC0000 compliance settings
          - python-version: "3.12"
            numpy_ver: "2.0.0"
            pandas_ver: "2.3.0"
            scipy_ver: "1.14.0"
            xarray_ver: "2024.5.0"
            os: ubuntu-latest
            test_config: "SPEC0000"
          # Minimum testing version
          - python-version: "3.10"
            dask_ver: "2022.12.1"
            netcdf_ver: "1.5.6"
            numpy_ver: "1.21.6"
            pandas_ver: "1.4.2"
            portalocker_ver: "2.0"
            pytest_ver: "7.1.3"
            scipy_ver: "1.8.1"
            toolz_ver: "0.12.0"
            xarray_ver: "2022.12.0"
            os: "ubuntu-22.04"
            test_config: "Min"

    name: Python ${{ matrix.python-version }} on ${{ matrix.os }} with numpy ${{ matrix.numpy_ver }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Reinstall fortran on MacOS
      if: ${{ matrix.os == 'macos-latest' }}
      run: brew reinstall gcc

    - name: Install Minimum dependencies
      if: ${{ matrix.test_config == 'Min'}}
      run: |
        pip install "setuptools<65"
        pip install numpy==${{ matrix.numpy_ver }}
        pip install scipy==${{ matrix.scipy_ver }}
        pip install pandas==${{ matrix.pandas_ver }}
        pip install xarray==${{ matrix.xarray_ver }}
        pip install dask==${{ matrix.dask_ver }}
        pip install portalocker==${{ matrix.portalocker_ver }}
        pip install pytest==${{ matrix.pytest_ver }}
        pip install toolz==${{ matrix.toolz_ver }}
        pip install --upgrade-strategy only-if-needed .[test]

    - name: Install NEP29 dependencies
      if: ${{ matrix.test_config == 'SPEC0000'}}
      run: |
        pip install numpy==${{ matrix.numpy_ver }}
        pip install pandas==${{ matrix.pandas_ver }}
        pip install scipy==${{ matrix.scipy_ver }}
        pip install xarray==${{ matrix.xarray_ver }}
        pip install --upgrade-strategy only-if-needed .[test]

    - name: Install pysat RC
      run: pip install --no-deps --pre -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pysat

    - name: Install standard dependencies
      if: ${{ matrix.numpy_ver == 'latest'}}
      run: pip install .[test]

    - name: Install aacgmv2
      # Optional package, continue with tests if install fails
      continue-on-error: true
      run: pip install aacgmv2 --no-binary==aacgmv2

    - name: Install apexpy for MacOS X
      # Only test apexpy for NEP29 tests
      if: ${{ matrix.numpy_ver != 'latest' && matrix.os == 'macos-latest' }}
      # Optional package, continue with tests if install fails
      continue-on-error: true
      run: |
          brew reinstall gcc
          /opt/homebrew/bin/gfortran --version
          /opt/homebrew/bin/gcc-14 --version
          CC=/opt/homebrew/bin/gcc-14 FC=/opt/homebrew/bin/gfortran pip install apexpy --no-binary==apexpy

    - name: Install apexpy for Unix/Windows
      # Only test apexpy for NEP29 tests
      if: ${{ matrix.numpy_ver != 'latest' && matrix.os != 'macos-latest' }}
      # Optional package, continue with tests if install fails
      continue-on-error: true
      run: pip install apexpy --no-binary==apexpy

    - name: Install OMMBV
      # Optional package, continue with tests if install fails
      continue-on-error: true
      run: pip install OMMBV --no-binary==OMMBV

    - name: Set up pysat
      run: |
        mkdir pysatData
        python -c "import pysat; pysat.params['data_dirs'] = 'pysatData'"

    - name: Test PEP8 compliance
      run: flake8 . --count --select=D,E,F,H,W --show-source --statistics

    - name: Evaluate complexity
      run: flake8 . --count --exit-zero --max-complexity=10 --statistics

    - name: Test with pytest
      run: pytest

    - name: Publish results to coveralls
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_PARALLEL: true
      run: coveralls --rcfile=pyproject.toml --service=github

  finish:
    name: Finish Coverage Analysis
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true
